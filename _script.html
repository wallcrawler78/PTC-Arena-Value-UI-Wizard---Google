<script>
(function() {
  'use strict';

  // ── State ──────────────────────────────────────────────────────────────────
  var WIZARD = {
    currentStep: 1,
    totalSteps: 9,
    formData: {},
    includeData: {},
    config: null,
    currentValues: {}
  };

  var STEP_META = [
    { num: 1, title: 'Company Profile',         subtitle: 'Basic customer information to anchor all calculations.' },
    { num: 2, title: 'Business Assumptions',    subtitle: 'Growth targets and product strategy assumptions.' },
    { num: 3, title: 'Cost Structure',          subtitle: 'COGS, material, inventory, and cost recovery baselines.' },
    { num: 4, title: 'Team Resources',          subtitle: 'Headcount and salary assumptions for each team.' },
    { num: 5, title: 'Revenue & COGS Benefits', subtitle: 'Adjust improvement sliders. Toggle to include or exclude each benefit.' },
    { num: 6, title: 'Productivity Benefits',   subtitle: 'Team efficiency improvements from better product data management.' },
    { num: 7, title: 'Cost Recovery Benefits',  subtitle: 'Reduction in operational cost categories.' },
    { num: 8, title: 'Legacy System Costs',     subtitle: 'Current PLM/PDM system costs and Arena investment for TCO comparison.' },
    { num: 9, title: 'Review & Submit',         subtitle: 'Review all inputs before writing to the spreadsheet.' }
  ];

  // ── Init ───────────────────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', function() {
    WIZARD.config = window.WIZ_CONFIG || { dataInputFields: [], benefitsFields: [], legacyTcoRows: [] };
    buildUI();
    loadCurrentValues();
  });

  function buildUI() {
    buildStepIndicator();
    buildSteps();
    bindNavigation();
  }

  // ── Step Indicator ─────────────────────────────────────────────────────────
  function buildStepIndicator() {
    var container = document.getElementById('stepIndicator');
    clearEl(container);
    STEP_META.forEach(function(meta, idx) {
      var item = make('div', 'step-item');
      item.dataset.step = meta.num;

      var circle = make('div', 'step-circle');
      circle.textContent = meta.num;

      var label = make('div', 'step-label');
      label.textContent = meta.title;

      item.appendChild(circle);
      item.appendChild(label);
      container.appendChild(item);

      if (idx < STEP_META.length - 1) {
        container.appendChild(make('div', 'step-connector'));
      }
    });
    updateStepIndicator();
  }

  function updateStepIndicator() {
    document.querySelectorAll('.step-item').forEach(function(item) {
      var num = parseInt(item.dataset.step);
      var circle = item.querySelector('.step-circle');
      item.classList.remove('active', 'done');
      if (num === WIZARD.currentStep) {
        item.classList.add('active');
        if (circle) circle.textContent = num;
      } else if (num < WIZARD.currentStep) {
        item.classList.add('done');
        if (circle) circle.textContent = '\u2713'; // ✓ checkmark
      } else {
        if (circle) circle.textContent = num;
      }
    });
    document.querySelectorAll('.step-connector').forEach(function(conn, idx) {
      conn.style.background = (idx < WIZARD.currentStep - 1)
        ? 'var(--arena-light)' : 'var(--border)';
    });
    document.getElementById('progressText').textContent =
      'Step ' + WIZARD.currentStep + ' of ' + WIZARD.totalSteps;
  }

  // ── Build All Steps ────────────────────────────────────────────────────────
  function buildSteps() {
    var body = document.getElementById('wizBody');
    clearEl(body);
    STEP_META.forEach(function(meta) {
      var panel = make('div', 'step-panel');
      panel.id = 'step-' + meta.num;
      if (meta.num === 1) panel.classList.add('active');

      var title = make('h2', 'step-title');
      title.textContent = meta.title;
      var subtitle = make('p', 'step-subtitle');
      subtitle.textContent = meta.subtitle;
      panel.appendChild(title);
      panel.appendChild(subtitle);

      switch (meta.num) {
        case 1: renderStep1(panel); break;
        case 2: renderStep2(panel); break;
        case 3: renderStep3(panel); break;
        case 4: renderStep4(panel); break;
        case 5: renderStep5(panel); break;
        case 6: renderStep6(panel); break;
        case 7: renderStep7(panel); break;
        case 8: renderStep8(panel); break;
        case 9: renderStep9(panel); break;
      }
      body.appendChild(panel);
    });
  }

  // ── Step 1: Company Profile ────────────────────────────────────────────────
  function renderStep1(panel) {
    var group = make('div', 'field-group single');
    getFieldsByStep(1, 'dataInput').forEach(function(field) {
      group.appendChild(buildInputField(field));
    });
    panel.appendChild(group);
  }

  // ── Step 2: Business Assumptions ──────────────────────────────────────────
  function renderStep2(panel) {
    getFieldsByStep(2, 'dataInput').forEach(function(field) {
      panel.appendChild(buildSliderField(field));
    });
  }

  // ── Step 3: Cost Structure ─────────────────────────────────────────────────
  function renderStep3(panel) {
    var fields = getFieldsByStep(3, 'dataInput');
    var byId = indexById(fields);

    appendDivider(panel, 'COGS & Materials');
    ['cogsPercent','directMaterialPercent','cmMaterialPercent'].forEach(function(id) {
      if (byId[id]) panel.appendChild(buildSliderField(byId[id]));
    });

    appendDivider(panel, 'Inventory');
    ['inventoryValue','inventoryCarryingCost'].forEach(function(id) {
      var f = byId[id];
      if (!f) return;
      panel.appendChild(f.type === 'slider' ? buildSliderField(f) : buildInputField(f));
    });

    appendDivider(panel, 'Cost Recovery Baselines');
    var grid = make('div', 'field-group');
    ['expeditingCosts','scrapRework','warrantyService','excessObsolete'].forEach(function(id) {
      if (byId[id]) grid.appendChild(buildInputField(byId[id]));
    });
    panel.appendChild(grid);
  }

  // ── Step 4: Team Resources ─────────────────────────────────────────────────
  function renderStep4(panel) {
    var fields = getFieldsByStep(4, 'dataInput');
    var byId = indexById(fields);

    var table = make('table', 'team-table');

    var thead = document.createElement('thead');
    var headerRow = document.createElement('tr');
    ['Role', '# of FTEs', 'Annual Salary ($)'].forEach(function(text) {
      var th = document.createElement('th');
      th.textContent = text;
      headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    var tbody = document.createElement('tbody');
    var roles = [
      { label: 'Development Team',        fteId: 'devTeamFTEs',    salaryId: 'devSalary' },
      { label: 'CAD Design',              fteId: 'cadFTEs',         salaryId: 'cadSalary' },
      { label: 'Eng Services / Doc Mgmt', fteId: 'engServicesFTEs', salaryId: 'engServicesSalary' },
      { label: 'Product Data Consumers',  fteId: 'pdcFTEs',         salaryId: 'pdcSalary', extra: 'pdcWorkweekPercent' },
      { label: 'Quality / CAPA',          fteId: 'qualityFTEs',     salaryId: 'qualitySalary' },
      { label: 'Compliance',              fteId: 'complianceFTEs',  salaryId: 'complianceSalary' },
      { label: 'Sourcing',                fteId: 'sourcingFTEs',    salaryId: 'sourcingSalary' }
    ];

    roles.forEach(function(role) {
      var fteField = byId[role.fteId];
      var salField = byId[role.salaryId];

      var tr = document.createElement('tr');
      var tdLabel = document.createElement('td');
      tdLabel.className = 'role-label';
      tdLabel.textContent = role.label;

      var tdFTE = document.createElement('td');
      if (fteField) tdFTE.appendChild(buildTableInput(fteField));

      var tdSalary = document.createElement('td');
      if (salField) tdSalary.appendChild(buildTableInput(salField));

      tr.appendChild(tdLabel);
      tr.appendChild(tdFTE);
      tr.appendChild(tdSalary);
      tbody.appendChild(tr);

      if (role.extra && byId[role.extra]) {
        var extraField = byId[role.extra];
        var trExtra = document.createElement('tr');
        var tdE1 = document.createElement('td');
        var tdE2 = document.createElement('td');
        tdE2.style.cssText = 'font-size:11px;color:var(--text-light);padding:4px 14px;';
        tdE2.textContent = '% Workweek Consuming Data';
        var tdE3 = document.createElement('td');
        var extraWrap = make('div', '');
        extraWrap.style.cssText = 'display:flex;align-items:center;gap:6px;';
        extraWrap.appendChild(buildTableInput(extraField));
        var pctLabel = document.createElement('span');
        pctLabel.textContent = '%';
        pctLabel.style.cssText = 'font-size:12px;color:var(--text-mid);';
        extraWrap.appendChild(pctLabel);
        tdE3.appendChild(extraWrap);
        trExtra.appendChild(tdE1);
        trExtra.appendChild(tdE2);
        trExtra.appendChild(tdE3);
        tbody.appendChild(trExtra);
      }
    });

    table.appendChild(tbody);

    // ── Total row ──────────────────────────────────────────────────────────────
    var tfoot = document.createElement('tfoot');
    var trTotal = document.createElement('tr');
    trTotal.className = 'fte-total-row';

    var tdTotalLabel = document.createElement('td');
    tdTotalLabel.className = 'role-label';
    tdTotalLabel.textContent = 'Total Arena Users';

    var tdTotalCount = document.createElement('td');
    var countSpan = document.createElement('span');
    countSpan.id = 'fte-total-count';
    countSpan.className = 'fte-total-value';
    countSpan.textContent = '—';
    tdTotalCount.appendChild(countSpan);

    var tdTotalPct = document.createElement('td');
    var pctSpan = document.createElement('span');
    pctSpan.id = 'fte-total-pct';
    pctSpan.className = 'fte-total-pct';
    pctSpan.textContent = '';
    tdTotalPct.appendChild(pctSpan);

    trTotal.appendChild(tdTotalLabel);
    trTotal.appendChild(tdTotalCount);
    trTotal.appendChild(tdTotalPct);
    tfoot.appendChild(trTotal);
    table.appendChild(tfoot);

    panel.appendChild(table);

    // Licensing context note
    var licenseNote = make('div', 'fte-license-note');
    var noteIcon = document.createElement('span');
    noteIcon.textContent = 'i';
    noteIcon.className = 'fte-note-icon';
    var noteText = document.createElement('span');
    noteText.id = 'fte-license-text';
    noteText.textContent = 'Total Arena Users estimates the Arena license count for this account.';
    licenseNote.appendChild(noteIcon);
    licenseNote.appendChild(noteText);
    panel.appendChild(licenseNote);

    var note = make('p', 'pdc-note');
    note.textContent = 'FTE defaults are calculated from Total Employees if left blank. Salaries default to $120,000.';
    panel.appendChild(note);

    // Wire live total update on each FTE input
    var fteIds = ['devTeamFTEs','cadFTEs','engServicesFTEs','pdcFTEs','qualityFTEs','complianceFTEs','sourcingFTEs'];
    fteIds.forEach(function(id) {
      var inp = document.getElementById('field_' + id);
      if (inp) inp.addEventListener('input', updateFTETotal);
    });
  }

  var FTE_DEFAULTS = {
    devTeamFTEs:    0.15,
    cadFTEs:        0.02,
    engServicesFTEs: 0.01,
    pdcFTEs:        0.20,
    qualityFTEs:    0.05,
    complianceFTEs: 0.02,
    sourcingFTEs:   0.01
  };

  /**
   * Auto-fills FTE counts from Total Employees × role default % when fields are empty.
   * Called every time Step 4 is shown; never overwrites user-entered values.
   */
  function autoFillStep4Defaults() {
    var employees = parseFloat(WIZARD.formData['totalEmployees']);
    if (!employees || isNaN(employees) || employees <= 0) {
      updateFTETotal();
      return;
    }
    Object.keys(FTE_DEFAULTS).forEach(function(id) {
      var current = WIZARD.formData[id];
      var isEmpty = (current === null || current === undefined || String(current).trim() === '');
      if (!isEmpty) return;
      var val = Math.max(1, Math.round(employees * FTE_DEFAULTS[id]));
      WIZARD.formData[id] = val;
      var input = document.getElementById('field_' + id);
      if (input) input.value = val;
    });
    updateFTETotal();
  }

  /**
   * Sums all FTE fields and updates the total row + licensing note.
   */
  function updateFTETotal() {
    var total = 0;
    Object.keys(FTE_DEFAULTS).forEach(function(id) {
      var val = parseFloat(WIZARD.formData[id]);
      if (!isNaN(val) && val > 0) total += val;
    });

    var countEl = document.getElementById('fte-total-count');
    if (countEl) countEl.textContent = total > 0 ? total : '—';

    var employees = parseFloat(WIZARD.formData['totalEmployees']) || 0;
    var pctEl = document.getElementById('fte-total-pct');
    if (pctEl) {
      if (total > 0 && employees > 0) {
        var pct = Math.round((total / employees) * 100);
        pctEl.textContent = pct + '% of ' + employees.toLocaleString() + ' employees';
      } else {
        pctEl.textContent = '';
      }
    }

    var noteEl = document.getElementById('fte-license-text');
    if (noteEl && total > 0) {
      noteEl.textContent = total + ' users estimated for Arena licensing — review with your Arena team.';
    }
  }

  // ── Steps 5-7: Benefits ────────────────────────────────────────────────────
  function renderBenefitStep(panel, stepNum) {
    var fields = getFieldsByStep(stepNum, 'benefits');

    // Bulk include / exclude bar
    var bar = make('div', 'bulk-toggle-bar');
    var inclBtn = make('button', 'btn btn-secondary btn-sm');
    inclBtn.textContent = 'Include All';
    inclBtn.addEventListener('click', function() {
      fields.forEach(function(f) {
        var t = document.getElementById('toggle_' + f.id);
        if (t) setInclude(t, f.id, true);
      });
    });
    var exclBtn = make('button', 'btn btn-secondary btn-sm');
    exclBtn.textContent = 'Exclude All';
    exclBtn.addEventListener('click', function() {
      fields.forEach(function(f) {
        var t = document.getElementById('toggle_' + f.id);
        if (t) setInclude(t, f.id, false);
      });
    });
    bar.appendChild(inclBtn);
    bar.appendChild(exclBtn);
    panel.appendChild(bar);

    fields.forEach(function(f) { panel.appendChild(buildBenefitSlider(f)); });
  }

  function renderStep5(panel) { renderBenefitStep(panel, 5); }
  function renderStep6(panel) { renderBenefitStep(panel, 6); }
  function renderStep7(panel) { renderBenefitStep(panel, 7); }

  // ── Step 8: Legacy System Costs ────────────────────────────────────────────
  // Sheet structure (confirmed):
  //   E3  = On-prem/Perpetual license toggle
  //   C5:C11 = Unit Cost per line item ($)
  //   D5:D11 = Qty (count or decimal multiplier)
  //   F5:F11 = Include in TCO (Yes/No)
  //   Total = C × D per row, summed in G12
  function renderStep8(panel) {
    var rows = WIZARD.config.legacyTcoRows || [];

    // ── On-prem toggle ──────────────────────────────────────────────────────
    appendDivider(panel, 'Deployment Type');
    var onPremWrap = make('div', 'legacy-onprem-wrap');

    var onPremLabel = document.createElement('label');
    onPremLabel.textContent = 'On-premises / Perpetual license?';
    onPremLabel.className = 'legacy-onprem-label';
    onPremWrap.appendChild(onPremLabel);

    var toggle = make('div', 'include-toggle');
    toggle.id = 'toggle_legacyOnPrem';
    toggle.setAttribute('role', 'group');

    var yesBtn = document.createElement('button');
    yesBtn.type = 'button';
    yesBtn.textContent = 'Yes';
    yesBtn.className = 'toggle-btn active';
    yesBtn.dataset.val = 'Yes';

    var noBtn = document.createElement('button');
    noBtn.type = 'button';
    noBtn.textContent = 'No';
    noBtn.className = 'toggle-btn';
    noBtn.dataset.val = 'No';

    function setOnPrem(val) {
      WIZARD.formData['legacyOnPrem'] = val;
      yesBtn.classList.toggle('active', val === 'Yes');
      noBtn.classList.toggle('active', val === 'No');
    }

    yesBtn.addEventListener('click', function() { setOnPrem('Yes'); });
    noBtn.addEventListener('click', function() { setOnPrem('No'); });

    toggle.appendChild(yesBtn);
    toggle.appendChild(noBtn);
    onPremWrap.appendChild(toggle);
    panel.appendChild(onPremWrap);

    if (!WIZARD.formData['legacyOnPrem']) {
      WIZARD.formData['legacyOnPrem'] = 'Yes';
    }

    // ── Line items table ────────────────────────────────────────────────────
    appendDivider(panel, 'Current Legacy System Costs');

    var table = make('table', 'team-table legacy-tco-table');
    var thead = document.createElement('thead');
    var headerRow = document.createElement('tr');
    ['Expense', 'Unit Cost ($)', 'Qty / Rate', 'Include'].forEach(function(text) {
      var th = document.createElement('th');
      th.textContent = text;
      headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    var tbody = document.createElement('tbody');

    rows.forEach(function(row) {
      var unitCostId = row.id + '_unitCost';
      var qtyId      = row.id + '_qty';
      var includeId  = row.id + '_include';

      var tr = document.createElement('tr');

      // Expense label + hint
      var tdLabel = document.createElement('td');
      tdLabel.className = 'role-label';
      var labelSpan = document.createElement('div');
      labelSpan.textContent = row.label;
      var hintSpan = document.createElement('div');
      hintSpan.textContent = row.hint || '';
      hintSpan.className = 'legacy-row-hint';
      tdLabel.appendChild(labelSpan);
      tdLabel.appendChild(hintSpan);
      tr.appendChild(tdLabel);

      // Unit Cost input
      var tdUnitCost = document.createElement('td');
      var unitInput = document.createElement('input');
      unitInput.type = 'number';
      unitInput.id = 'field_' + unitCostId;
      unitInput.name = unitCostId;
      unitInput.min = '0';
      unitInput.placeholder = '0';
      unitInput.className = 'legacy-currency-input';
      unitInput.addEventListener('input', function() {
        var v = parseFloat(this.value);
        WIZARD.formData[unitCostId] = isNaN(v) ? null : v;
        updateLegacyTCOTotal();
      });
      tdUnitCost.appendChild(unitInput);
      tr.appendChild(tdUnitCost);

      // Qty input
      var tdQty = document.createElement('td');
      var qtyInput = document.createElement('input');
      qtyInput.type = 'number';
      qtyInput.id = 'field_' + qtyId;
      qtyInput.name = qtyId;
      qtyInput.min = '0';
      qtyInput.placeholder = row.qtyLabel;
      qtyInput.className = 'legacy-qty-input';
      // Set default
      if (row.qtyDefault !== null && row.qtyDefault !== undefined) {
        var curQty = WIZARD.formData[qtyId];
        var qtyEmpty = (curQty === null || curQty === undefined || String(curQty).trim() === '');
        if (qtyEmpty) {
          WIZARD.formData[qtyId] = row.qtyDefault;
          qtyInput.value = row.qtyDefault;
        } else {
          qtyInput.value = curQty;
        }
      }
      qtyInput.addEventListener('input', function() {
        var v = parseFloat(this.value);
        WIZARD.formData[qtyId] = isNaN(v) ? null : v;
        updateLegacyTCOTotal();
      });
      var qtyLabelSpan = document.createElement('div');
      qtyLabelSpan.textContent = row.qtyLabel;
      qtyLabelSpan.className = 'legacy-row-hint';
      tdQty.appendChild(qtyInput);
      tdQty.appendChild(qtyLabelSpan);
      tr.appendChild(tdQty);

      // Include toggle
      var tdInclude = document.createElement('td');
      var incToggle = make('div', 'include-toggle');
      incToggle.id = 'toggle_' + includeId;
      var curInc = WIZARD.formData[includeId];
      var isIncluded = (curInc === null || curInc === undefined) ? row.defaultInclude : curInc;
      WIZARD.formData[includeId] = isIncluded;

      var yBtn = document.createElement('button');
      yBtn.type = 'button';
      yBtn.textContent = 'Yes';
      yBtn.className = 'toggle-btn' + (isIncluded ? ' active' : '');

      var nBtn = document.createElement('button');
      nBtn.type = 'button';
      nBtn.textContent = 'No';
      nBtn.className = 'toggle-btn' + (!isIncluded ? ' active' : '');

      (function(yb, nb, id) {
        yb.addEventListener('click', function() {
          WIZARD.formData[id] = true;
          yb.classList.add('active'); nb.classList.remove('active');
        });
        nb.addEventListener('click', function() {
          WIZARD.formData[id] = false;
          nb.classList.add('active'); yb.classList.remove('active');
        });
      })(yBtn, nBtn, includeId);

      incToggle.appendChild(yBtn);
      incToggle.appendChild(nBtn);
      tdInclude.appendChild(incToggle);
      tr.appendChild(tdInclude);

      tbody.appendChild(tr);
    });

    table.appendChild(tbody);

    // Total footer row
    var tfoot = document.createElement('tfoot');
    var trTotal = document.createElement('tr');
    trTotal.className = 'fte-total-row';
    var tdTL = document.createElement('td');
    tdTL.className = 'role-label';
    tdTL.textContent = 'Legacy Annual TCO';
    var tdTV = document.createElement('td');
    tdTV.colSpan = 3;
    var totalSpan = document.createElement('span');
    totalSpan.id = 'legacy-annual-total';
    totalSpan.className = 'fte-total-value';
    totalSpan.textContent = '\u2014';
    tdTV.appendChild(totalSpan);
    trTotal.appendChild(tdTL);
    trTotal.appendChild(tdTV);
    tfoot.appendChild(trTotal);
    table.appendChild(tfoot);

    panel.appendChild(table);

    var note = make('p', 'pdc-note');
    note.textContent = 'Unit Cost \xd7 Qty = row total. The sheet formula sums all included rows automatically.';
    panel.appendChild(note);

    // Restore any previously loaded unit cost values
    rows.forEach(function(row) {
      var v = WIZARD.formData[row.id + '_unitCost'];
      if (v !== null && v !== undefined) {
        var inp = document.getElementById('field_' + row.id + '_unitCost');
        if (inp) inp.value = v;
      }
    });

    updateLegacyTCOTotal();
  }

  function updateLegacyTCOTotal() {
    var rows = WIZARD.config.legacyTcoRows || [];
    var total = 0;
    rows.forEach(function(row) {
      var unitCost = parseFloat(WIZARD.formData[row.id + '_unitCost']);
      var qty = parseFloat(WIZARD.formData[row.id + '_qty']);
      var included = WIZARD.formData[row.id + '_include'] !== false;
      if (!isNaN(unitCost) && !isNaN(qty) && included) {
        total += unitCost * (row.qtyStoreAs === 'decimal' ? qty / 100 : qty);
      }
    });
    var el = document.getElementById('legacy-annual-total');
    if (el) el.textContent = total > 0 ? formatCurrency(total) : '\u2014';
  }

  // ── Step 9: Review ────────────────────────────────────────────────────────
  function renderStep9(panel) {
    var grid = make('div', 'review-grid');
    grid.id = 'reviewGrid';
    panel.appendChild(grid);
  }

  function populateReview() {
    var grid = document.getElementById('reviewGrid');
    if (!grid) return;
    clearEl(grid);

    var sections = [
      { title: 'Company Profile',         fields: getFieldsByStep(1, 'dataInput') },
      { title: 'Business Assumptions',    fields: getFieldsByStep(2, 'dataInput') },
      { title: 'Cost Structure',          fields: getFieldsByStep(3, 'dataInput') },
      { title: 'Team Resources',          fields: getFieldsByStep(4, 'dataInput') },
      { title: 'Revenue & COGS Benefits', fields: getFieldsByStep(5, 'benefits'), isBenefit: true },
      { title: 'Productivity Benefits',   fields: getFieldsByStep(6, 'benefits'), isBenefit: true },
      { title: 'Cost Recovery Benefits',  fields: getFieldsByStep(7, 'benefits'), isBenefit: true },
      { title: 'Legacy System Costs', fields: [], isLegacyTco: true }
    ];

    sections.forEach(function(sec) {
      var section = make('div', 'review-section' + (sec.isBenefit ? ' review-full' : ''));

      var secTitle = make('div', 'review-section-title');
      secTitle.textContent = sec.title;
      section.appendChild(secTitle);

      if (sec.isLegacyTco) {
        // Special rendering for Legacy TCO rows
        var onPrem = WIZARD.formData['legacyOnPrem'];
        var onPremRow = make('div', 'review-row');
        var onPremLabel = make('span', 'rv-label');
        onPremLabel.textContent = 'On-premises / Perpetual';
        var onPremVal = make('span', 'rv-value');
        onPremVal.textContent = onPrem || 'Yes';
        onPremRow.appendChild(onPremLabel);
        onPremRow.appendChild(onPremVal);
        section.appendChild(onPremRow);

        (WIZARD.config.legacyTcoRows || []).forEach(function(tcoRow) {
          var uc = WIZARD.formData[tcoRow.id + '_unitCost'];
          var qty = WIZARD.formData[tcoRow.id + '_qty'];
          var inc = WIZARD.formData[tcoRow.id + '_include'];
          var rr = make('div', 'review-row');
          var rl = make('span', 'rv-label');
          rl.textContent = tcoRow.label;
          var rv = make('span', 'rv-value');
          if (inc === false) {
            rv.className = 'rv-excluded';
            rv.textContent = 'Excluded';
          } else if (uc !== null && uc !== undefined && qty !== null && qty !== undefined) {
            var lineTotal = parseFloat(uc) * (tcoRow.qtyStoreAs === 'decimal' ? parseFloat(qty) / 100 : parseFloat(qty));
            rv.textContent = formatCurrency(lineTotal) + ' / yr';
          } else {
            rv.className = 'rv-skip';
            rv.textContent = '(not entered)';
          }
          rr.appendChild(rl);
          rr.appendChild(rv);
          section.appendChild(rr);
        });
      } else {
        sec.fields.forEach(function(field) {
          var row = make('div', 'review-row');
          var label = make('span', 'rv-label');
          label.textContent = field.label;

          var value = make('span', 'rv-value');
          var rawVal = WIZARD.formData[field.id];

          if (sec.isBenefit && WIZARD.includeData[field.id + '_include'] === false) {
            value.className = 'rv-excluded';
            value.textContent = 'Excluded';
          } else if (rawVal === null || rawVal === undefined || rawVal === '') {
            value.className = 'rv-skip';
            value.textContent = '(using default)';
          } else if (field.unit === '%') {
            value.textContent = rawVal + '%';
          } else if (field.storeAs === 'currency' || field.type === 'currency') {
            value.textContent = formatCurrency(parseFloat(rawVal));
          } else {
            value.textContent = rawVal;
          }

          row.appendChild(label);
          row.appendChild(value);
          section.appendChild(row);
        });
      }
      grid.appendChild(section);
    });
  }

  // ── Field Builders ─────────────────────────────────────────────────────────

  function buildInputField(field) {
    var wrapper = make('div', 'field');

    var label = document.createElement('label');
    label.htmlFor = 'field_' + field.id;
    label.textContent = field.label;
    if (field.required) {
      var dot = make('span', 'req-dot');
      dot.setAttribute('aria-label', 'Required');
      dot.setAttribute('title', 'Required field');
      label.appendChild(dot);
    }
    wrapper.appendChild(label);

    if (field.hint) {
      var hint = make('p', 'hint');
      hint.textContent = field.hint;
      wrapper.appendChild(hint);
    }

    var isCurrency = (field.type === 'currency');
    var input = document.createElement('input');
    input.type = isCurrency ? 'text' : (field.type === 'text' ? 'text' : 'number');
    input.id = 'field_' + field.id;
    input.name = field.id;
    input.setAttribute('aria-describedby', 'err_' + field.id);
    if (field.placeholder) input.placeholder = field.placeholder;
    if (!isCurrency && field.min !== undefined) input.min = field.min;
    if (!isCurrency && field.max !== undefined) input.max = field.max;
    if (field.type === 'number') input.step = '1';

    input.addEventListener('input', function() {
      WIZARD.formData[field.id] = isCurrency
        ? (input.value === '' ? '' : parseFloat(input.value.replace(/[^0-9.]/g, '')))
        : input.value;
      clearFieldError(field.id);
      refreshNextButton();
    });

    if (isCurrency) {
      // Format with commas on blur; restore raw number on focus
      input.addEventListener('blur', function() {
        var raw = WIZARD.formData[field.id];
        if (raw !== null && raw !== undefined && raw !== '' && !isNaN(raw)) {
          input.value = parseFloat(raw).toLocaleString('en-US', { maximumFractionDigits: 0 });
        }
      });
      input.addEventListener('focus', function() {
        var raw = WIZARD.formData[field.id];
        input.value = (raw !== null && raw !== undefined && raw !== '') ? String(raw) : '';
      });
    }

    var errMsg = make('span', 'field-error');
    errMsg.id = 'err_' + field.id;
    errMsg.textContent = field.label + ' is required.';

    if (isCurrency) {
      var wrap = make('div', 'currency-wrap');
      var sym = make('span', 'currency-sym');
      sym.textContent = '$';
      wrap.appendChild(sym);
      wrap.appendChild(input);
      wrapper.appendChild(wrap);
    } else {
      wrapper.appendChild(input);
    }
    wrapper.appendChild(errMsg);
    return wrapper;
  }

  function buildSliderField(field) {
    var wrapper = make('div', 'slider-field');

    var header = make('div', 'slider-header');
    var labelEl = make('span', 'slider-label');
    labelEl.textContent = field.label;

    var badge = make('span', 'slider-value-badge');
    badge.id = 'badge_' + field.id;
    var defaultVal = (field.default !== null && field.default !== undefined) ? field.default : field.min;
    badge.textContent = defaultVal + (field.unit || '');

    header.appendChild(labelEl);
    header.appendChild(badge);
    wrapper.appendChild(header);

    if (field.hint) {
      var hint = make('p', 'hint');
      hint.textContent = field.hint;
      wrapper.appendChild(hint);
    }

    var input = makeSlider(field, defaultVal);
    input.addEventListener('input', function() {
      var val = parseFloat(input.value);
      WIZARD.formData[field.id] = val;
      badge.textContent = val + (field.unit || '');
      updateSliderGradient(input);
    });
    WIZARD.formData[field.id] = defaultVal;

    var trackWrap = make('div', 'slider-track-wrap');
    trackWrap.appendChild(input);
    wrapper.appendChild(trackWrap);

    var anchors = make('div', 'slider-anchors');
    var anchorLow = make('span', 'anchor-low');
    anchorLow.textContent = field.min + (field.unit || '');
    var anchorHigh = make('span', 'anchor-high');
    anchorHigh.textContent = field.max + (field.unit || '');
    anchors.appendChild(anchorLow);
    anchors.appendChild(anchorHigh);
    wrapper.appendChild(anchors);

    return wrapper;
  }

  function buildBenefitSlider(field) {
    var wrapper = make('div', 'slider-field');
    var defaultVal = (field.default !== null && field.default !== undefined) ? field.default : field.min;

    // Header: label | include toggle | value badge
    var header = make('div', 'slider-header');
    var labelEl = make('span', 'slider-label');
    labelEl.textContent = field.label;
    var toggle = buildIncludeToggle(field);
    var badge = make('span', 'slider-value-badge');
    badge.id = 'badge_' + field.id;
    badge.textContent = defaultVal + '%';
    header.appendChild(labelEl);
    header.appendChild(toggle);
    header.appendChild(badge);
    wrapper.appendChild(header);

    // Low/high descriptive anchors
    if (field.lowAnchor || field.highAnchor) {
      var anchorsDesc = make('div', 'slider-anchors');
      if (field.lowAnchor) {
        var lo = make('span', 'anchor-low');
        lo.textContent = field.lowAnchor;
        anchorsDesc.appendChild(lo);
      }
      if (field.highAnchor) {
        var hi = make('span', 'anchor-high');
        hi.textContent = field.highAnchor;
        anchorsDesc.appendChild(hi);
      }
      wrapper.appendChild(anchorsDesc);
    }

    // Slider track
    var input = makeSlider(field, defaultVal);
    WIZARD.formData[field.id] = defaultVal;
    var trackWrap = make('div', 'slider-track-wrap');
    trackWrap.appendChild(input);
    wrapper.appendChild(trackWrap);

    // Maturity dots (positioned below track, aligned to thumb travel)
    var dotsEl = null;
    var stateBox = null;
    if (field.maturityLevels && field.maturityLevels.length) {
      dotsEl = buildMaturityDots(field);
      wrapper.appendChild(dotsEl);
    }

    // Numeric min/max labels
    var numAnchors = make('div', 'slider-anchors');
    var numLow = make('span', 'anchor-low');
    numLow.textContent = field.min + '%  Low';
    var numHigh = make('span', 'anchor-high');
    numHigh.textContent = 'High  ' + field.max + '%';
    numAnchors.appendChild(numLow);
    numAnchors.appendChild(numHigh);
    wrapper.appendChild(numAnchors);

    // Maturity state description box
    if (field.maturityLevels && field.maturityLevels.length) {
      stateBox = make('div', 'maturity-state');
      stateBox.id = 'mstate_' + field.id;
      var stateInner = make('div', 'maturity-state-inner');
      stateInner.appendChild(make('div', 'state-label'));
      stateInner.appendChild(make('p', 'state-desc'));
      stateBox.appendChild(stateInner);
      wrapper.appendChild(stateBox);
      updateMaturityUI(field, defaultVal, stateBox, dotsEl);
    }

    // Wire slider events (after stateBox and dotsEl exist)
    input.addEventListener('input', function() {
      var val = parseFloat(input.value);
      WIZARD.formData[field.id] = val;
      badge.textContent = val + '%';
      updateSliderGradient(input);
      if (stateBox && dotsEl) updateMaturityUI(field, val, stateBox, dotsEl);
    });

    return wrapper;
  }

  function makeSlider(field, defaultVal) {
    var input = document.createElement('input');
    input.type = 'range';
    input.id = 'field_' + field.id;
    input.name = field.id;
    input.setAttribute('aria-label', field.label);
    input.min = field.min;
    input.max = field.max;
    input.step = (field.unit === 'wks') ? 1 : 0.5;
    input.value = defaultVal;
    updateSliderGradient(input);
    return input;
  }

  function buildIncludeToggle(field) {
    var defaultInc = field.defaultInclude !== false;
    WIZARD.includeData[field.id + '_include'] = defaultInc;

    var toggle = make('div', 'include-toggle ' + (defaultInc ? 'yes' : 'no'));
    toggle.id = 'toggle_' + field.id;
    toggle.setAttribute('role', 'group');
    toggle.setAttribute('aria-label', 'Include ' + field.label);

    var yes = make('span', 'tog-yes');
    yes.textContent = 'Yes';
    yes.setAttribute('tabindex', '0');
    yes.setAttribute('role', 'button');
    yes.setAttribute('aria-label', 'Include');

    var no = make('span', 'tog-no');
    no.textContent = 'No';
    no.setAttribute('tabindex', '0');
    no.setAttribute('role', 'button');
    no.setAttribute('aria-label', 'Exclude');

    toggle.appendChild(yes);
    toggle.appendChild(no);

    yes.addEventListener('click', function() { setInclude(toggle, field.id, true); });
    no.addEventListener('click', function() { setInclude(toggle, field.id, false); });
    yes.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setInclude(toggle, field.id, true); }
    });
    no.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setInclude(toggle, field.id, false); }
    });

    return toggle;
  }

  function setInclude(toggleEl, fieldId, included) {
    WIZARD.includeData[fieldId + '_include'] = included;
    toggleEl.classList.toggle('yes', included);
    toggleEl.classList.toggle('no', !included);
    // Dim the slider card when excluded so users see it's inactive
    var sliderCard = toggleEl.closest ? toggleEl.closest('.slider-field') : null;
    if (!sliderCard && toggleEl.parentNode) sliderCard = toggleEl.parentNode.parentNode; // fallback
    if (sliderCard && sliderCard.classList.contains('slider-field')) {
      sliderCard.classList.toggle('excluded', !included);
    }
  }

  function buildTableInput(field) {
    var input = document.createElement('input');
    input.type = 'number';
    input.id = 'field_' + field.id;
    input.name = field.id;
    if (field.min !== undefined) input.min = field.min;
    input.step = (field.type === 'currency') ? 'any' : 1;

    // Pre-fill defaults so they are written to the sheet even if user doesn't change them
    if (field.default !== null && field.default !== undefined) {
      input.value = field.default;
      WIZARD.formData[field.id] = field.default;
    } else if (field.placeholder) {
      input.placeholder = field.placeholder;
    }

    input.addEventListener('input', function() {
      WIZARD.formData[field.id] = input.value === '' ? null : parseFloat(input.value);
    });
    return input;
  }

  // ── Slider gradient ────────────────────────────────────────────────────────
  // Fixed red→yellow→green spectrum across the full range.
  // The thumb position shows where the current value sits on the quality scale.
  // This ensures green is always visible at high values (critical bug fix).
  function updateSliderGradient(slider) {
    var min = parseFloat(slider.min);
    var max = parseFloat(slider.max);
    if (max === min) { slider.style.background = 'var(--slider-low)'; return; }
    slider.style.background =
      'linear-gradient(to right,' +
      ' var(--slider-low) 0%,' +
      ' var(--slider-mid) 50%,' +
      ' var(--slider-high) 100%)';
  }

  // ── Maturity Level UI ──────────────────────────────────────────────────────

  /**
   * Builds a row of positioned dot markers at each maturity level's pct.
   * Dots use calc() to align with the range thumb's travel path (9px offset for thumb radius).
   */
  function buildMaturityDots(field) {
    var container = make('div', 'maturity-dots');
    container.id = 'mdots_' + field.id;
    field.maturityLevels.forEach(function(level) {
      var dot = make('div', 'maturity-dot');
      dot.title = level.label;
      var ratio = (field.max === field.min) ? 0
        : (level.pct - field.min) / (field.max - field.min);
      // Align dot center with thumb center at this % position
      dot.style.left = (ratio * 100).toFixed(3) + '%';
      container.appendChild(dot);
    });
    return container;
  }

  /**
   * Returns the maturity level object nearest to the given slider value.
   */
  function getMaturityLevel(field, val) {
    var best = field.maturityLevels[0];
    var bestDist = Math.abs(best.pct - val);
    field.maturityLevels.forEach(function(lv) {
      var d = Math.abs(lv.pct - val);
      if (d < bestDist) { bestDist = d; best = lv; }
    });
    return best;
  }

  /**
   * Returns an hsl() color string interpolated from red (low) to green (high).
   * hue: 0 (red) → 120 (green)
   */
  function getMaturityColor(val, min, max) {
    var ratio = (max === min) ? 0 : Math.max(0, Math.min(1, (val - min) / (max - min)));
    var hue = Math.round(ratio * 120);
    return 'hsl(' + hue + ', 68%, 40%)';
  }

  /**
   * Updates the maturity state box and dots to reflect the current slider value.
   */
  function updateMaturityUI(field, val, stateEl, dotsEl) {
    if (!field.maturityLevels || !stateEl || !dotsEl) return;
    var level = getMaturityLevel(field, val);
    if (!level) return;
    var color = getMaturityColor(val, field.min, field.max);

    // Update state box
    stateEl.style.borderLeftColor = color;
    var labelEl = stateEl.querySelector('.state-label');
    var descEl  = stateEl.querySelector('.state-desc');
    // Animate when crossing into a new maturity zone
    var inner = stateEl.querySelector('.maturity-state-inner');
    if (inner && labelEl && labelEl.textContent !== level.label) {
      inner.classList.remove('state-enter');
      void inner.offsetWidth; // force reflow to restart animation
      inner.classList.add('state-enter');
    }
    if (labelEl) { labelEl.textContent = level.label; labelEl.style.color = color; }
    if (descEl)  descEl.textContent = level.description;

    // Update dots — highlight the nearest one
    var nearestIdx = 0;
    var minDist = Infinity;
    field.maturityLevels.forEach(function(lv, i) {
      var d = Math.abs(lv.pct - val);
      if (d < minDist) { minDist = d; nearestIdx = i; }
    });
    var dots = dotsEl.querySelectorAll('.maturity-dot');
    dots.forEach(function(dot, i) {
      if (i === nearestIdx) {
        dot.classList.add('active');
        dot.style.background = color;
      } else {
        dot.classList.remove('active');
        dot.style.background = '';
      }
    });
  }

  // ── Load existing sheet values ─────────────────────────────────────────────
  function loadCurrentValues() {
    showSpinner('Loading current values...');
    google.script.run
      .withSuccessHandler(function(values) {
        WIZARD.currentValues = values || {};
        applyCurrentValues();
        refreshNextButton();
        hideSpinner();
      })
      .withFailureHandler(function(err) {
        hideSpinner();
        showToast('Could not load existing values: ' + (err.message || String(err)), 'error');
      })
      .getCurrentValues();
  }

  function applyCurrentValues() {
    var vals = WIZARD.currentValues;
    if (!vals) return;

    WIZARD.config.dataInputFields.forEach(function(field) {
      var val = vals[field.id];
      if (val === null || val === undefined) return;
      WIZARD.formData[field.id] = val;
      var input = document.getElementById('field_' + field.id);
      if (!input) return;
      if (input.type === 'range') {
        var numVal = clamp(parseFloat(val), parseFloat(input.min), parseFloat(input.max));
        input.value = numVal;
        WIZARD.formData[field.id] = numVal;
        var badge = document.getElementById('badge_' + field.id);
        if (badge) badge.textContent = numVal + (field.unit || '');
        updateSliderGradient(input);
      } else {
        input.value = val;
      }
    });

    // Apply Legacy TCO rows (onPrem toggle + unitCost/qty/include per row)
    if (vals['legacyOnPrem'] !== null && vals['legacyOnPrem'] !== undefined) {
      WIZARD.formData['legacyOnPrem'] = vals['legacyOnPrem'];
    }
    (WIZARD.config.legacyTcoRows || []).forEach(function(row) {
      var ucVal  = vals[row.id + '_unitCost'];
      var qtyVal = vals[row.id + '_qty'];
      var incVal = vals[row.id + '_include'];
      if (ucVal  !== null && ucVal  !== undefined) { WIZARD.formData[row.id + '_unitCost'] = ucVal; }
      if (qtyVal !== null && qtyVal !== undefined) { WIZARD.formData[row.id + '_qty']      = qtyVal; }
      if (incVal !== null && incVal !== undefined) { WIZARD.formData[row.id + '_include']  = incVal; }
    });

    WIZARD.config.benefitsFields.forEach(function(field) {
      var val = vals[field.id];
      var inc = vals[field.id + '_include'];

      if (val !== null && val !== undefined) {
        var input = document.getElementById('field_' + field.id);
        if (input) {
          var numVal = clamp(parseFloat(val), parseFloat(input.min), parseFloat(input.max));
          input.value = numVal;
          WIZARD.formData[field.id] = numVal;
          var badge = document.getElementById('badge_' + field.id);
          if (badge) badge.textContent = numVal + '%';
          updateSliderGradient(input);
          if (field.maturityLevels) {
            var stateEl = document.getElementById('mstate_' + field.id);
            var dotsEl  = document.getElementById('mdots_'  + field.id);
            updateMaturityUI(field, numVal, stateEl, dotsEl);
          }
        }
      }

      if (inc !== null && inc !== undefined) {
        WIZARD.includeData[field.id + '_include'] = inc;
        var toggleEl = document.getElementById('toggle_' + field.id);
        if (toggleEl) setInclude(toggleEl, field.id, inc);
      }
    });
  }

  // ── Navigation ─────────────────────────────────────────────────────────────
  function bindNavigation() {
    document.getElementById('btnBack').addEventListener('click', goBack);
    document.getElementById('btnNext').addEventListener('click', goNext);
    document.getElementById('btnSubmit').addEventListener('click', submitWizard);

    // Enter key advances to next step (unless focus is on a button or textarea)
    document.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      var tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'BUTTON' || tag === 'TEXTAREA') return;
      if (WIZARD.currentStep < WIZARD.totalSteps) goNext();
    });
  }

  function goBack() {
    if (WIZARD.currentStep > 1) showStep(WIZARD.currentStep - 1);
  }

  function goNext() {
    if (validateCurrentStep() && WIZARD.currentStep < WIZARD.totalSteps) {
      showStep(WIZARD.currentStep + 1);
    }
  }

  function showStep(num) {
    document.querySelectorAll('.step-panel').forEach(function(p) {
      p.classList.remove('active');
    });
    var panel = document.getElementById('step-' + num);
    if (panel) panel.classList.add('active');
    WIZARD.currentStep = num;
    updateStepIndicator();
    updateNavButtons();
    document.getElementById('wizBody').scrollTop = 0;
    if (num === 3) autoFillStep3Defaults();
    if (num === 4) autoFillStep4Defaults();
    if (num === 8) updateLegacyTCOTotal();
    if (num === 9) populateReview();
  }

  /**
   * Auto-populates Cost Structure baselines from Annual Revenue when fields are empty.
   * Called every time Step 3 is shown; never overwrites a value the user has entered.
   *   inventoryValue      = Revenue × 10%
   *   expeditingCosts     = Revenue × 0.2%
   *   scrapRework         = Revenue × 0.2%
   *   warrantyService     = Revenue × 0.2%
   *   excessObsolete      = Revenue × 0.2%
   */
  function autoFillStep3Defaults() {
    var revenue = parseFloat(WIZARD.formData['annualRevenue']);
    if (!revenue || isNaN(revenue) || revenue <= 0) return;

    var defaults = {
      inventoryValue:   Math.round(revenue * 0.10),
      expeditingCosts:  Math.round(revenue * 0.002),
      scrapRework:      Math.round(revenue * 0.002),
      warrantyService:  Math.round(revenue * 0.002),
      excessObsolete:   Math.round(revenue * 0.002)
    };

    Object.keys(defaults).forEach(function(id) {
      var current = WIZARD.formData[id];
      var isEmpty = (current === null || current === undefined || String(current).trim() === '');
      if (!isEmpty) return; // never overwrite user input

      var val = defaults[id];
      WIZARD.formData[id] = val;
      var input = document.getElementById('field_' + id);
      if (input) input.value = val;
    });
  }

  function updateNavButtons() {
    var isLast = WIZARD.currentStep === WIZARD.totalSteps;
    document.getElementById('btnBack').disabled = (WIZARD.currentStep === 1);
    document.getElementById('btnNext').style.display = isLast ? 'none' : 'inline-flex';
    document.getElementById('btnSubmit').style.display = isLast ? 'inline-flex' : 'none';
    refreshNextButton();
  }

  // Disable Next in real time until all required fields on the current step are filled
  function refreshNextButton() {
    var btn = document.getElementById('btnNext');
    if (!btn || btn.style.display === 'none') return;
    var requiredFields = getFieldsByStep(WIZARD.currentStep, 'dataInput').filter(function(f) {
      return f.required;
    });
    if (requiredFields.length === 0) { btn.disabled = false; return; }
    var allFilled = requiredFields.every(function(f) {
      var val = WIZARD.formData[f.id];
      return val !== null && val !== undefined && String(val).trim() !== '';
    });
    btn.disabled = !allFilled;
  }

  // ── Client-side Validation ─────────────────────────────────────────────────
  function validateCurrentStep() {
    if (WIZARD.currentStep > 4) return true; // sliders always have valid defaults
    var fields = getFieldsByStep(WIZARD.currentStep, 'dataInput');
    var valid = true;
    fields.forEach(function(field) {
      if (field.required) {
        var val = WIZARD.formData[field.id];
        if (val === null || val === undefined || String(val).trim() === '') {
          showFieldError(field.id, field.label + ' is required.');
          valid = false;
        }
      }
    });
    return valid;
  }

  function showFieldError(fieldId, msg) {
    var input = document.getElementById('field_' + fieldId);
    if (input) input.classList.add('error');
    var errEl = document.getElementById('err_' + fieldId);
    if (errEl) { errEl.textContent = msg; errEl.classList.add('visible'); }
  }

  function clearFieldError(fieldId) {
    var input = document.getElementById('field_' + fieldId);
    if (input) input.classList.remove('error');
    var errEl = document.getElementById('err_' + fieldId);
    if (errEl) errEl.classList.remove('visible');
  }

  // ── Submit ─────────────────────────────────────────────────────────────────
  function submitWizard() {
    var payload = {};
    Object.keys(WIZARD.formData).forEach(function(k) { payload[k] = WIZARD.formData[k]; });
    Object.keys(WIZARD.includeData).forEach(function(k) { payload[k] = WIZARD.includeData[k]; });

    showSpinner('Saving to spreadsheet...');
    document.getElementById('btnSubmit').disabled = true;

    google.script.run
      .withSuccessHandler(function(result) {
        hideSpinner();
        document.getElementById('btnSubmit').disabled = false;
        if (result.success) {
          showToast('Values saved successfully!', 'success');
          setTimeout(function() { google.script.host.close(); }, 1800);
        } else {
          var msgs = Array.isArray(result.errors) ? result.errors.join('; ') : 'Unknown error';
          showToast('Errors: ' + msgs, 'error');
        }
      })
      .withFailureHandler(function(err) {
        hideSpinner();
        document.getElementById('btnSubmit').disabled = false;
        showToast('Save failed: ' + (err.message || String(err)), 'error');
      })
      .saveWizardData(payload);
  }

  // ── Utilities ──────────────────────────────────────────────────────────────

  function getFieldsByStep(stepNum, source) {
    var list;
    if (source === 'dataInput') {
      list = WIZARD.config.dataInputFields || [];
    } else if (source === 'legacyTco') {
      list = []; // legacyTco uses rows structure, not flat fields
    } else {
      list = WIZARD.config.benefitsFields || [];
    }
    return list.filter(function(f) { return f.step === stepNum; });
  }

  function indexById(fields) {
    var map = {};
    fields.forEach(function(f) { map[f.id] = f; });
    return map;
  }

  function appendDivider(parent, text) {
    var div = make('div', 'section-divider');
    div.textContent = text;
    parent.appendChild(div);
  }

  function make(tag, className) {
    var e = document.createElement(tag);
    if (className) {
      className.trim().split(/\s+/).forEach(function(c) { if (c) e.classList.add(c); });
    }
    return e;
  }

  function clearEl(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
  }

  function clamp(val, min, max) {
    return Math.max(min, Math.min(max, val));
  }

  function formatCurrency(val) {
    if (isNaN(val)) return '$-';
    return '$' + val.toLocaleString('en-US', { maximumFractionDigits: 0 });
  }

  function showSpinner(msg) {
    var overlay = document.getElementById('spinnerOverlay');
    var text = document.getElementById('spinnerText');
    if (text) text.textContent = msg || 'Loading...';
    if (overlay) overlay.classList.add('show');
  }

  function hideSpinner() {
    var overlay = document.getElementById('spinnerOverlay');
    if (overlay) overlay.classList.remove('show');
  }

  function showToast(msg, type) {
    var toast = document.getElementById('toast');
    if (!toast) return;
    toast.textContent = msg;
    toast.className = 'toast ' + (type || '');
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 3500);
  }

})();
</script>
