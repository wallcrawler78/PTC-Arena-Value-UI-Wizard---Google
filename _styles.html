<style>
  /* ── Reset & Base ─────────────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* ── Arena by PTC brand colors ── */
    --arena-green:      #00890B;   /* Arena primary green (from arenasolutions.com) */
    --arena-dark:       #004D07;   /* Header / dark anchor */
    --arena-mid:        #007B0E;   /* Mid-green for gradients */
    --arena-light:      #40AA1D;   /* Light accent green */
    --arena-tint:       #EAF7EB;   /* Very light green tint for backgrounds */
    --ptc-orange:       #F47920;   /* PTC orange — Submit CTA only */
    --ptc-blue:         #005B9E;   /* Kept for backwards compat references */
    --ptc-light-blue:   #0093D0;   /* Kept for backwards compat references */
    /* ── Neutrals ── */
    --bg:               #F5F7FA;
    --text-dark:        #1A2A1A;
    --text-mid:         #4A5568;
    --text-light:       #718096;
    --border:           #E0E4EA;
    --white:            #FFFFFF;
    --success:          #2F855A;
    --danger:           #C53030;
    /* ── Slider spectrum ── */
    --slider-low:       #E53E3E;
    --slider-mid:       #D69E2E;
    --slider-high:      #38A169;
    --radius:           8px;
    --shadow:           0 2px 8px rgba(0,0,0,.10);
    --transition:       0.18s ease;
  }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 14px;
    color: var(--text-dark);
    background: var(--bg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ──────────────────────────────────────────────────────────────── */
  .wiz-header {
    background: linear-gradient(135deg, var(--arena-dark) 0%, var(--arena-mid) 100%);
    color: var(--white);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  /* Logo pill — white background lets the full-colour Arena logo pop on green */
  .logo-pill {
    background: var(--white);
    border-radius: 6px;
    padding: 5px 14px;
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }
  .logo-img {
    height: 26px;
    width: auto;
    display: block;
  }
  .header-divider {
    width: 1px;
    height: 28px;
    background: rgba(255,255,255,.25);
    flex-shrink: 0;
  }
  .wiz-header .tagline {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,.85);
    letter-spacing: .3px;
  }

  /* ── Step Indicator ──────────────────────────────────────────────────────── */
  .step-indicator {
    display: flex;
    align-items: center;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 10px 24px;
    gap: 0;
    overflow-x: auto;
    flex-shrink: 0;
  }
  .step-item {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .step-circle {
    position: relative;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-light);
    background: var(--white);
    transition: var(--transition);
  }
  .step-label {
    font-size: 11px;
    color: var(--text-light);
    white-space: nowrap;
    transition: var(--transition);
  }
  .step-connector {
    flex: 1;
    min-width: 16px;
    height: 2px;
    background: var(--border);
    margin: 0 4px;
    transition: var(--transition);
  }
  .step-item.done .step-circle {
    background: var(--arena-light);
    border-color: var(--arena-light);
    color: var(--white);
  }
  .step-item.done + .step-connector { background: var(--arena-light); }
  .step-item.active .step-circle {
    background: var(--arena-green);
    border-color: var(--arena-green);
    color: var(--white);
    box-shadow: 0 0 0 3px rgba(0,137,11,.22);
  }
  .step-item.active .step-label { color: var(--arena-green); font-weight: 600; }

  /* ── Content Area ────────────────────────────────────────────────────────── */
  .wiz-body {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }

  .step-panel { display: none; }
  .step-panel.active { display: block; }

  .step-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--arena-dark);
    margin-bottom: 4px;
  }
  .step-subtitle {
    font-size: 13px;
    color: var(--text-mid);
    margin-bottom: 20px;
  }

  /* ── Form Fields ─────────────────────────────────────────────────────────── */
  .field-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  .field-group.single { grid-template-columns: 1fr; }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .field label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dark);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .req-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--danger);
    flex-shrink: 0;
    display: inline-block;
  }
  .field .hint,
  .slider-field .hint {
    font-size: 11px;
    color: var(--text-light);
    margin-top: -4px;
  }
  .field input[type="text"],
  .field input[type="number"] {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 14px;
    color: var(--text-dark);
    background: var(--white);
    transition: border-color var(--transition), box-shadow var(--transition);
    width: 100%;
  }
  .field input:focus {
    outline: none;
    border-color: var(--arena-green);
    box-shadow: 0 0 0 3px rgba(0,137,11,.15);
  }
  .field input.error { border-color: var(--danger); }
  .field-error {
    font-size: 11px;
    color: var(--danger);
    display: none;
  }
  .field-error.visible { display: block; }

  /* ── Sliders ─────────────────────────────────────────────────────────────── */
  .slider-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 12px;
    padding: 14px 16px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .slider-field .slider-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .slider-field .slider-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dark);
    flex: 1;
  }
  .slider-value-badge {
    background: var(--arena-green);
    color: var(--white);
    font-size: 13px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 12px;
    min-width: 52px;
    text-align: center;
    transition: background var(--transition);
  }

  /* Include toggle chip */
  .include-toggle {
    display: flex;
    align-items: center;
    gap: 0;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    font-size: 11px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .include-toggle .tog-yes,
  .include-toggle .tog-no {
    padding: 4px 10px;
    cursor: pointer;
    transition: var(--transition);
    user-select: none;
  }
  .include-toggle .tog-yes {
    background: var(--white);
    color: var(--text-light);
  }
  .include-toggle .tog-no {
    background: var(--white);
    color: var(--text-light);
  }
  .include-toggle.yes .tog-yes {
    background: var(--success);
    color: var(--white);
  }
  .include-toggle.no .tog-no {
    background: var(--danger);
    color: var(--white);
  }

  /* Range input (slider) */
  .slider-track-wrap {
    position: relative;
    padding: 4px 0 2px;
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--arena-green);
    border: 2px solid var(--white);
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
    cursor: pointer;
    transition: transform var(--transition);
  }
  input[type="range"]::-webkit-slider-thumb:active {
    transform: scale(1.2);
  }
  input[type="range"]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--arena-green);
    border: 2px solid var(--white);
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
    cursor: pointer;
  }
  .slider-anchors {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--text-light);
    margin-top: 4px;
    gap: 8px;
  }
  .slider-anchors .anchor-low { color: var(--danger); text-align: left; flex: 1; }
  .slider-anchors .anchor-high { color: var(--success); text-align: right; flex: 1; }

  /* Excluded benefit slider — dimmed, range thumb disabled */
  .slider-field.excluded { opacity: 0.42; }
  .slider-field.excluded input[type="range"] { pointer-events: none; }

  /* Currency input with $ prefix */
  .currency-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .currency-wrap .currency-sym {
    position: absolute;
    left: 10px;
    color: var(--text-mid);
    font-size: 14px;
    pointer-events: none;
    user-select: none;
  }
  .currency-wrap input {
    padding-left: 22px !important;
  }

  /* Bulk include/exclude bar (benefit steps) */
  .bulk-toggle-bar {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-bottom: 10px;
  }
  .btn-sm {
    padding: 5px 14px;
    font-size: 12px;
  }

  /* ── Team Resources Table (Step 4) ───────────────────────────────────────── */
  .team-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--white);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    font-size: 13px;
  }
  .team-table th {
    background: var(--arena-green);
    color: var(--white);
    padding: 10px 14px;
    text-align: left;
    font-weight: 600;
    font-size: 12px;
  }
  .team-table td {
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  .team-table tbody tr:last-child td { border-bottom: none; }
  .team-table tbody tr:hover td { background: rgba(0,137,11,.04); }
  .team-table .role-label { font-weight: 600; color: var(--text-dark); }
  /* Legacy TCO table */
  .legacy-tco-table td { vertical-align: top; padding: 10px 12px; }
  .legacy-tco-table .legacy-row-hint { font-size: 10px; color: var(--text-light); margin-top: 2px; }
  .legacy-currency-input, .legacy-qty-input {
    width: 100%; padding: 6px 10px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px;
  }
  .legacy-currency-input:focus, .legacy-qty-input:focus {
    outline: none; border-color: var(--arena-green);
    box-shadow: 0 0 0 2px rgba(0,137,11,.15);
  }
  .legacy-qty-input { max-width: 90px; }
  /* On-prem toggle row */
  .legacy-onprem-wrap { display: flex; align-items: center; gap: 16px; padding: 10px 0 4px; }
  .legacy-onprem-label { font-size: 13px; font-weight: 600; color: var(--text-dark); }

  /* FTE total footer row */
  .fte-total-row td {
    background: var(--arena-dark);
    color: var(--white);
    padding: 10px 14px;
    font-weight: 600;
    font-size: 13px;
    border-top: 2px solid var(--arena-green);
  }
  .fte-total-value {
    font-size: 20px;
    font-weight: 700;
    color: var(--white);
  }
  .fte-total-pct {
    font-size: 12px;
    color: rgba(255,255,255,0.75);
  }
  /* Licensing context note */
  .fte-license-note {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-top: 10px;
    padding: 10px 14px;
    background: var(--arena-tint);
    border-left: 3px solid var(--arena-green);
    border-radius: 0 6px 6px 0;
    font-size: 12px;
    color: var(--text-dark);
  }
  .fte-note-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    min-width: 16px;
    background: var(--arena-green);
    color: var(--white);
    border-radius: 50%;
    font-size: 10px;
    font-weight: 700;
    font-style: normal;
  }
  .team-table input[type="number"] {
    width: 100%;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  .team-table input[type="number"]:focus {
    outline: none;
    border-color: var(--arena-green);
    box-shadow: 0 0 0 2px rgba(0,137,11,.15);
  }
  .pdc-note {
    font-size: 11px;
    color: var(--text-light);
    margin-top: 8px;
    padding: 8px 12px;
    background: var(--arena-tint);
    border-radius: 6px;
    border-left: 3px solid var(--arena-light);
  }

  /* ── Review Step ─────────────────────────────────────────────────────────── */
  .review-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .review-section {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .review-section-title {
    background: var(--arena-green);
    color: var(--white);
    font-size: 12px;
    font-weight: 700;
    padding: 8px 14px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .review-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .review-row:last-child { border-bottom: none; }
  .review-row .rv-label { color: var(--text-mid); flex: 1; }
  .review-row .rv-value { font-weight: 600; color: var(--text-dark); text-align: right; }
  .review-row .rv-skip { color: var(--text-light); font-style: italic; }
  .review-row .rv-excluded { color: var(--danger); font-size: 11px; }
  .review-full { grid-column: 1 / -1; }

  /* ── Footer / Navigation ─────────────────────────────────────────────────── */
  .wiz-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: var(--white);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    gap: 12px;
  }
  .wiz-footer .progress-text {
    font-size: 12px;
    color: var(--text-light);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 22px;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: var(--transition);
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-secondary {
    background: var(--white);
    color: var(--text-mid);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover:not(:disabled) { background: var(--bg); border-color: var(--text-light); }
  .btn-primary {
    background: var(--arena-green);
    color: var(--white);
  }
  .btn-primary:hover:not(:disabled) { background: var(--arena-dark); }
  .btn-success {
    background: var(--success);
    color: var(--white);
  }
  .btn-success:hover:not(:disabled) { background: #276749; }
  .btn-orange {
    background: var(--ptc-orange);
    color: var(--white);
  }
  .btn-orange:hover:not(:disabled) { background: #d4671a; }

  /* ── Toast / Alert ───────────────────────────────────────────────────────── */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text-dark);
    color: var(--white);
    padding: 10px 20px;
    border-radius: var(--radius);
    font-size: 13px;
    opacity: 0;
    transition: opacity .3s, transform .3s;
    z-index: 9999;
    pointer-events: none;
    max-width: 80%;
    text-align: center;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.success { background: var(--success); }
  .toast.error   { background: var(--danger); }

  /* ── Spinner ─────────────────────────────────────────────────────────────── */
  .spinner-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,.7);
    z-index: 9998;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    font-size: 14px;
    color: var(--arena-green);
  }
  .spinner-overlay.show { display: flex; }
  .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid var(--border);
    border-top-color: var(--arena-green);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Section divider ─────────────────────────────────────────────────────── */
  .section-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 16px 0 12px;
    color: var(--arena-green);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .section-divider::before,
  .section-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── Maturity Dots ───────────────────────────────────────────────────────── */
  .maturity-dots {
    position: relative;
    height: 14px;
    margin: 2px 0 0;
    padding: 0 9px;        /* match range thumb radius so 0%–100% = thumb travel */
    box-sizing: border-box;
  }
  .maturity-dot {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
    border: 2px solid var(--white);
    box-shadow: 0 0 0 1px var(--border);
    transition: background 0.2s, width 0.2s, height 0.2s;
    cursor: default;
  }
  .maturity-dot.active {
    width: 11px;
    height: 11px;
    box-shadow: 0 0 0 2px rgba(0,0,0,.12);
  }

  /* ── Maturity State Box ──────────────────────────────────────────────────── */
  .maturity-state {
    padding: 8px 12px;
    border-left: 3px solid var(--border);
    border-radius: 0 var(--radius) var(--radius) 0;
    background: var(--bg);
    transition: border-color 0.3s ease;
    margin-top: 2px;
  }
  .maturity-state .state-label {
    font-size: 12px;
    font-weight: 600;
    display: block;
    margin-bottom: 2px;
    transition: color 0.3s ease;
  }
  .maturity-state .state-desc {
    font-size: 11px;
    color: var(--text-mid);
    line-height: 1.5;
    margin: 0;
  }
  /* Fade-in animation when crossing maturity zone boundary */
  .maturity-state-inner.state-enter {
    animation: maturityFadeIn 0.25s ease-out;
  }
  @keyframes maturityFadeIn {
    from { opacity: 0; transform: translateY(-3px); }
    to   { opacity: 1; transform: translateY(0);    }
  }
  .slider-field.excluded .maturity-state,
  .slider-field.excluded .maturity-dots  { opacity: 0.4; pointer-events: none; }

  /* ── Responsive tweaks ───────────────────────────────────────────────────── */
  @media (max-width: 600px) {
    .field-group { grid-template-columns: 1fr; }
    .review-grid { grid-template-columns: 1fr; }
  }

  /* ── Dual Maturity Slider Card ──────────────────────────────────────────── */
  .dual-slider-section {
    margin-top: 10px;
    padding: 10px 14px;
    border-radius: var(--radius);
    background: var(--bg);
    border: 1px solid var(--border);
  }

  .dual-slider-section + .dual-slider-section {
    margin-top: 6px;
  }

  .dual-section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .5px;
    text-transform: uppercase;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dual-section-label.current-label {
    color: var(--text-mid);
  }

  .dual-section-label.future-label {
    color: var(--arena-dark);
  }

  .dual-section-label .section-badge {
    font-size: 12px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
    margin-left: auto;
  }

  .current-label .section-badge {
    background: #E2E8F0;
    color: var(--text-mid);
  }

  .future-label .section-badge {
    background: var(--arena-tint);
    color: var(--arena-dark);
  }

  /* Current-state slider uses a flat grey gradient */
  .current-state-track input[type="range"] {
    background: linear-gradient(to right, #CBD5E0 0%, #A0AEC0 100%) !important;
  }

  /* Net benefit bar shown between the two sections */
  .net-benefit-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 0;
    gap: 8px;
    font-size: 12px;
    color: var(--text-mid);
  }

  .net-benefit-bar .net-value {
    font-size: 14px;
    font-weight: 700;
    color: var(--arena-green);
    background: var(--arena-tint);
    border-radius: 10px;
    padding: 2px 10px;
  }
