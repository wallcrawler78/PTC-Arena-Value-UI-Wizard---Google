<body>

  <!-- Server config injected at render time — no async round-trip needed -->
  <script>
    window.WIZ_CONFIG = <?!= JSON.stringify(getWizardConfig()); ?>;
  </script>

  <!-- ── Header ── -->
  <header class="wiz-header">
    <div class="logo-wrap">
      <!-- Arena wordmark SVG -->
      <svg class="logo-svg" viewBox="0 0 140 36" xmlns="http://www.w3.org/2000/svg" aria-label="Arena by PTC">
        <!-- Stylised "a" mark -->
        <circle cx="16" cy="18" r="15" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
        <text x="9" y="24" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="900" fill="white">a</text>
        <!-- "rena" wordmark -->
        <text x="36" y="25" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="white" letter-spacing="-0.5">rena</text>
        <!-- "by PTC" -->
        <text x="36" y="35" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="400" fill="rgba(255,255,255,0.65)" letter-spacing="1">by PTC</text>
      </svg>
    </div>
    <div class="header-divider"></div>
    <div class="tagline">Value Assessment Wizard</div>
  </header>

  <!-- ── Step Indicator ── -->
  <nav class="step-indicator" id="stepIndicator" aria-label="Wizard steps"></nav>

  <!-- ── Body ── -->
  <main class="wiz-body" id="wizBody" role="main"></main>

  <!-- ── Footer / Navigation ── -->
  <footer class="wiz-footer">
    <span class="progress-text" id="progressText">Step 1 of 8</span>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-secondary" id="btnBack" disabled>&#8592; Back</button>
      <button class="btn btn-primary"   id="btnNext">Next &#8594;</button>
      <button class="btn btn-orange"    id="btnSubmit" style="display:none;">Submit to Sheet</button>
    </div>
  </footer>

  <!-- ── Spinner overlay ── -->
  <div class="spinner-overlay" id="spinnerOverlay" role="status" aria-live="polite">
    <div class="spinner"></div>
    <span id="spinnerText">Loading...</span>
  </div>

  <!-- ── Toast notification ── -->
  <div class="toast" id="toast" role="alert" aria-live="assertive"></div>
